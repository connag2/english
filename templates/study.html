{% extends 'base.html' %}
{% block content %}
<div class="bg-white rounded-xl p-4 shadow-md space-y-3">
  <div class="text-sm text-gray-500">문제 {{ st.index + 1 }} / {{ st.questions|length }}</div>
  <div class="text-2xl font-bold">{{ q.prompt }}</div>

  {% if st.mode == 'mcq' %}
  <form method="post" action="{{ url_for('study_answer') }}" class="space-y-2">
    {% for c in q.choices %}
      <label class="block border rounded-lg p-2"><input type="radio" name="choice" value="{{ c }}" /> {{ c }}</label>
    {% endfor %}
    <button class="bg-indigo-500 text-white rounded-lg px-4 py-2" {{ 'disabled' if st.answered }}>정답 확인</button>
  </form>
  {% else %}
  <form method="post" action="{{ url_for('study_answer') }}" class="space-y-2">
    <input name="guess" class="w-full border rounded-lg p-2" placeholder="뜻 입력" />
    <button class="bg-indigo-500 text-white rounded-lg px-4 py-2" {{ 'disabled' if st.answered }}>정답 확인</button>
  </form>
  {% endif %}

  <div class="flex gap-2">
    <form method="post" action="{{ url_for('study_next') }}"><button class="bg-gray-800 text-white rounded-lg px-4 py-2">다음 문제</button></form>
    <form method="post" action="{{ url_for('study_quit') }}"><button class="bg-rose-500 text-white rounded-lg px-4 py-2">학습 종료</button></form>
  </div>
</div>
{% endblock %}
