<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VocaFlow Web</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="mb-4">
      <h1 class="text-2xl font-bold">VocaFlow Web</h1>
      <p class="text-sm text-gray-500">영단어 암기 웹앱</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="space-y-2 mb-4">
          {% for category, message in messages %}
            <div class="rounded-lg px-3 py-2 shadow-sm {{ 'bg-indigo-100 text-indigo-800' if category=='ok' else 'bg-rose-100 text-rose-800' }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
